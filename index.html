<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOPIB BER — Toshkentda usta toping</title>
<style>
:root{--bg:#f6f7f9;--cd:#fff;--tx:#14181f;--mu:#667085;--ac:#0a7c66;--ax:#fff;--bd:#e3e6eb}
@media(prefers-color-scheme:dark){:root{--bg:#0f1318;--cd:#181e26;--tx:#eef1f5;--mu:#98a2b3;--ac:#2cc3a4;--ax:#06201a;--bd:#2a323d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Roboto,sans-serif;line-height:1.45}
.w{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 4px}
.mu{color:var(--mu);font-size:.9rem}
.cta{display:block;text-decoration:none;background:var(--ac);color:var(--ax);padding:14px;border-radius:14px;margin:14px 0}
.cta b{display:block;font-size:1.05rem}
.cta.o{background:none;color:var(--ac);border:1px solid var(--ac)}
.f{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.f input,.f select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--cd);color:var(--tx);font-size:1rem}
.f input{grid-column:1/-1}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-top:10px}
.a{display:flex;gap:8px;margin-top:10px}
.a a{flex:1;text-align:center;padding:10px;border-radius:10px;text-decoration:none;font-weight:600;border:1px solid var(--ac);color:var(--ac)}
.a a.p{background:var(--ac);color:var(--ax)}
</style>
</head>
<body>
<div class="w">
<h1>🛠️ TOPIB BER</h1>
<div class="mu">Toshkent boʻyicha ishonchli ustalarni toping</div>
<a class="cta" id="f1" target="_blank" rel="noopener"><b>Usta kerakmi?</b>Soʻrov qoldiring — biz ustani topib beramiz →</a>
<a class="cta o" id="f2" target="_blank" rel="noopener" style="display:none"><b>Siz ustamisiz?</b>Bizga qoʻshiling va mijozlar toping →</a>
<div class="f">
<input id="q" type="search" placeholder="Usta yoki xizmat qidiring…">
<select id="d"></select>
<select id="s"></select>
</div>
<div id="list"></div>
</div>
<script>
var FORM_SOROV="https://forms.gle/sD3YsM8R2k3Mseh56";
var FORM_USTA="https://forms.gle/jTsbreJV8A9X9Bnp6";
var DATA=[];
var DIST=["Chilonzor","Yunusobod","Mirzo Ulugʻbek","Sergeli","Yakkasaroy","Shayxontohur","Olmazor","Mirobod","Yashnobod","Uchtepa"];
var CATS=["Santexnik","Elektrik","Duradgor","Konditsioner","Maishiy texnika","Kafel / pol","Boʻyoqchi","Kompyuter"];
var $=function(i){return document.getElementById(i)};
$("f1").href=FORM_SOROV;
if(FORM_USTA){$("f2").href=FORM_USTA;$("f2").style.display="block"}
$("d").innerHTML='<option value="">Barcha tumanlar</option>'+DIST.map(function(a){return"<option>"+a+"</option>"}).join("");
$("s").innerHTML='<option value="">Barcha xizmatlar</option>'+CATS.map(function(a){return"<option>"+a+"</option>"}).join("");
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){
var q=$("q").value.toLowerCase(),d=$("d").value,s=$("s").value;
var a=DATA.filter(function(u){return(!d||u.d===d)&&(!s||u.c===s)&&(!q||(u.n+u.c+u.d).toLowerCase().indexOf(q)>-1)});
$("list").innerHTML=a.length?a.map(function(u){var t=u.p.replace(/\s/g,"");
return'<div class="c"><b>'+esc(u.n)+'</b><div class="mu">'+esc(u.c)+" · "+esc(u.d)+"</div>"+(u.x?'<div class="mu">'+Number(u.x).toLocaleString("ru-RU")+" soʻmdan / soat</div>":"")+'<div class="a"><a class="p" href="tel:'+esc(t)+'">📞 Qoʻngʻiroq</a><a href="https://t.me/'+esc(t)+'">Telegram</a></div></div>'}).join(""):
'<div class="c mu">'+(DATA.length?"Hech narsa topilmadi.":"Ustalar qoʻshilmoqda. Hozir yuqoridagi tugma orqali soʻrov qoldiring, biz ustani topib beramiz.")+"</div>"}
["q","d","s"].forEach(function(i){$(i).oninput=render});
render();
</script>
</body>
</html>
